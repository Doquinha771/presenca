name: Validar Presença+
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: presenca_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test && npm run check
      - name: Validar migração e permissões em banco descartável
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: test-only
          PGDATABASE: presenca_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f sql/01_portal.sql
          psql -v ON_ERROR_STOP=1 -f sql/03_v4.sql
          psql -v ON_ERROR_STOP=1 -f sql/04_v4_1.sql
          psql -v ON_ERROR_STOP=1 -f sql/05_v4_1_2.sql
          psql -v ON_ERROR_STOP=1 -f tests/database.sql
          node tests/concurrency.mjs
      - name: Instalar navegador para testes
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - run: npm run test:browser
